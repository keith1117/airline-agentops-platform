services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: "Airline Ticket Reservation System"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
      - ./sql/agent_migration.sql:/docker-entrypoint-initdb.d/02-agent.sql:ro
      - ./sql/insert.sql:/docker-entrypoint-initdb.d/03-insert.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: "Airline Ticket Reservation System"
      RAG_POLICY_PATH: docs/policies/airline_policy.md
      AGENT_ROUTER_MODE: ${AGENT_ROUTER_MODE:-auto}
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-single_step}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-4}
      TOOL_ROUTER_MODE: ${TOOL_ROUTER_MODE:-auto}
      RAG_RETRIEVER_MODE: ${RAG_RETRIEVER_MODE:-auto}
      POLICY_ANSWER_MODE: ${POLICY_ANSWER_MODE:-auto}
      AGENT_TRACE_ENABLED: ${AGENT_TRACE_ENABLED:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      RAG_EMBEDDING_CACHE: instance/rag/policy_embeddings.json
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.35}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      METRICS_LOG_PATH: logs/agent_metrics.jsonl
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "scripts.seed_p0_demo"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: "Airline Ticket Reservation System"
      RAG_POLICY_PATH: docs/policies/airline_policy.md
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.flask
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: "Airline Ticket Reservation System"
      AGENT_SERVICE_URL: http://agent:8001
      SECRET_KEY: dev
      FLASK_DEBUG: 0
      FLASK_PORT: 5000
    ports:
      - "5050:5000"
    depends_on:
      mysql:
        condition: service_healthy
      agent:
        condition: service_started
      seed:
        condition: service_completed_successfully

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
